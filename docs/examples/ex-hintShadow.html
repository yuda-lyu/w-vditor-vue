<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for hintShadow</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- w-vditor-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-vditor-vue@1.0.1/dist/w-vditor-vue.umd.js"></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
  .cpitem {
    transition: all 0.3s;
    padding: 5px 15px;
    cursor: pointer;
  }
  .cpitem-white {
    background: #fff;
  }
  .cpitem-white:hover {
    background: #eee;
  }
  .cpitem-black {
    background: #333;
  }
  .cpitem-black:hover {
    background: #555;
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">hintShadow</div>
            <a
                href="//yuda-lyu.github.io/w-vditor-vue/examples/ex-hintShadow.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-vditor-vue/blob/master/docs/examples/ex-hintShadow.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div
                style="color:#f26; font-size:0.9rem; padding-bottom:10px;"
            >* 於編輯區內輸入空白再輸入「/ht」即可顯示提示區</div>

            <div style="display:flex; flex-wrap:wrap; padding-bottom:40px;">
                <div style="width:620px; max-width:100%; padding-right:20px;">
                    <div
                        style="font-size:0.8rem; color:#666; padding-bottom:5px;"
                    >hintShadow: false</div>
                    <w-vditor-vue
                        :key-hint="'/ht'"
                        :hint-shadow="false"
                        v-model="content"
                    >
                        <template v-slot:content="props">
                            <div
                                style="padding:4px 0px; min-width:120px; border:1px solid #ddd;"
                            >
                                <div
                                    class="cpitem cpitem-white"
                                    :key="kitem"
                                    v-for="(item,kitem) in items1"
                                    @click="props.funInsert(item); props.funHide();"
                                >Item {{item}}</div>
                            </div>
                        </template>
                    </w-vditor-vue>
                </div>

                <div style="width:620px; max-width:100%;">
                    <div
                        style="font-size:0.8rem; color:#666; padding-bottom:5px;"
                    >hintShadow: true, hintShadowStyle: '0 3px 12px 0 rgba(255,34,102,0.5)'</div>
                    <w-vditor-vue
                        :key-hint="'/ht'"
                        :hint-shadow="true"
                        :hint-shadow-style="'0 3px 12px 0 rgba(255,34,102,0.5)'"
                        v-model="content"
                    >
                        <template v-slot:content="props">
                            <div style="padding:4px 0px; min-width:120px;">
                                <div
                                    class="cpitem cpitem-white"
                                    :key="kitem"
                                    v-for="(item,kitem) in items1"
                                    @click="props.funInsert(item); props.funHide();"
                                >Item {{item}}</div>
                            </div>
                        </template>
                    </w-vditor-vue>
                </div>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-vditor-vue", window["w-vditor-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        content:
          "# w-vditor-vue\n\nabc中文123，一個包裝 vditor 的 Vue 2 編輯器組件。\n\n## 文字樣式\n\n**粗體**、*斜體*、~~刪除線~~，以及連結 [google](//www.google.com/)。\n\n## 清單\n\n- 無序項目\n- 支援巢狀\n    - 子項目\n\n1. 有序項目\n2. 第二項\n\n## 引用與分隔線\n\n> 三種編輯模式：所見即所得（wysiwyg）、即時渲染（ir）、分屏預覽（sv）。\n\n---\n\n## 表格\n\n| 屬性 | 說明 | 預設 |\n| --- | --- | --- |\n| value | markdown 字串 | 空字串 |\n| height | 編輯器高度（px） | 250 |\n| keyHint | 提示區觸發字串 | 空字串 |\n",
        items1: ["foo", "bar", "fizz", "buzz"],
        actions: []
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {}
  });
    </script>
</body>
</html>
